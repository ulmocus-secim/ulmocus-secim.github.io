<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ulmocus Seçim</title>
<meta name="description" content="Ulmocus Seçim: Türkçe canlı seçim sonuçları. ABD 3 Kasım 2026 ara seçimleri, Yeni Zelanda 7 Kasım 2026 genel seçimi. Geçmiş: İsrail 26. Knesset seçimi.">
<style>body{margin:0;font:15px system-ui,sans-serif;background:#EEF1F5;color:#141B26;display:grid;place-items:center;min-height:100vh}@media(prefers-color-scheme:dark){body{background:#0E131B;color:#E6EBF2}}</style>
</head>
<body>
<p>Yükleniyor…</p>
<script>
(function () {
// Ulmocus Seçim yükleyicisi: seçilen seçimin sayfasını raw.githubusercontent.com'dan yükler (Pages yayınına bağlı değil)
// ve üste "Aktif / Gelecek / Geçmiş seçimler" menüsünü ekler. Adres: ?secim=<kimlik>.
// Durum tarihten hesaplanır: sayim (ilk sandıkların kapanışı) öncesi "gelecek", sayim–bitis arası "aktif" (sayım sürüyor), sonrası "gecmis".
// Varsayılan: ilk aktif seçim; yoksa en yakın gelecek seçim; yoksa en son geçmiş seçim.
var SECIMLER = [
  { id: "abd-2026", ad: "ABD 2026 ara seçimleri", tarih: "3 Kasım 2026", sayim: "2026-11-04T02:00:00+03:00", bitis: "2026-11-06T12:00:00+03:00", repo: "ulmocus-secim/abd-2026" },
  { id: "yeni-zelanda-2026", ad: "Yeni Zelanda genel seçimi", tarih: "7 Kasım 2026", sayim: "2026-11-07T09:00:00+03:00", bitis: "2026-11-08T12:00:00+03:00", repo: "ulmocus-secim/yeni-zelanda-2026" },
  { id: "knesset-2026", ad: "İsrail 26. Knesset seçimi", tarih: "27 Ekim 2026", sayim: "2026-10-27T22:00:00+03:00", bitis: "2026-10-29T00:00:00+03:00",
    src: "https://raw.githubusercontent.com/erdemnope-hash/ulmocus-secim/main/index.html", yedek: "https://erdemnope-hash.github.io/ulmocus-secim/" }
];
// "Siyasi meseleler" yazıları: sayfanın en üstündeki düğme, en alttaki bu bölüme götürür. Her rakam kaynaklarda var.
var SIYASI = {
  "abd-2026": { guncel: "29 Ekim 2026", p: [
    "Donald Trump Ocak 2025'te ikinci başkanlık dönemine başladı. Cumhuriyetçiler hem Beyaz Saray'ı hem de Kongre'nin iki kanadını elinde tutuyor: Senato'da 53'e 47, Temsilciler Meclisi'nde ise birkaç sandalyelik dar bir çoğunluk. Bu çoğunlukla vergi indirimleri ve harcama kesintilerini bir araya getiren büyük bütçe yasası (\"One Big Beautiful Bill\") Temmuz 2025'te geçti.",
    "Gündemin merkezinde ekonomi var: gümrük vergileri, hayat pahalılığı ve enflasyon. Anketlerde seçmenlerin en büyük kaygısı fiyatlar; Trump'ın en düşük not aldığı konular da enflasyon ve ekonomi. Göç politikası ve sınır dışı etme operasyonları ile sağlık harcamaları da öne çıkan başlıklar. Ekim–Kasım 2025'te federal hükümet 43 gün kapalı kaldı; bu, ABD tarihinin en uzun kapanmasıydı.",
    "Seçim haritaları da tartışmalı. Teksas'ın 2025'te seçim bölgelerini dönem ortasında Cumhuriyetçiler lehine yeniden çizmesiyle bir \"harita savaşı\" başladı; Kaliforniya Kasım 2025'te Önerme 50 ile Demokratlar lehine karşılık verdi, başka eyaletler de izledi. Bu yüzden bazı Meclis yarışları 2024'tekinden farklı sınırlarla yapılıyor.",
    "Ekim sonu anketlerinde Trump'ın onay oranı çoğu ortalamada %37–40 arasında; genel kongre oylamasında Demokratlar 7–9 puan önde. Tahmin modelleri Demokratları Temsilciler Meclisi'nde açık, Senato'da ise hafif favori görüyor. Senato'yu almak için Demokratların net 4 koltuk kazanması gerekiyor (50–50'de oyu Cumhuriyetçi başkan yardımcısı JD Vance verir).",
    "Sonuç neden önemli: Demokratlar Meclis'i kazanırsa bütçe ve yasa gündemini durdurabilir, soruşturma açabilir; Trump son iki yılını bölünmüş bir hükümetle geçirir. Cumhuriyetçiler iki kanadı da korursa Trump'ın gündemi büyük ölçüde engelsiz sürer." ],
    k: [["NPR anketi (21 Ekim 2026)", "https://www.npr.org/2026/10/21/nx-s1-6011179/poll-democrats-republicans-trump-approval"],
        ["PBS son anket", "https://www.pbs.org/newshour/politics/poll-likely-voters-favor-democrats-as-trump-disapproval-drives-early-turnout"],
        ["The Conversation (26 Ekim 2026)", "https://theconversation.com/democrats-remain-clear-favourites-to-gain-control-of-congress-at-midterms-as-trumps-ratings-slide-again-295134"],
        ["Vikipedi: 2026 ABD seçimleri", "https://en.wikipedia.org/wiki/2026_United_States_elections"]] },
  "yeni-zelanda-2026": { guncel: "29 Ekim 2026", p: [
    "2023 seçiminden bu yana Başbakan Christopher Luxon'un National partisi, ACT ve NZ First ile üçlü koalisyon hükümeti yürütüyor. Ana muhalefet Chris Hipkins liderliğindeki Labour; Yeşiller ve Te Pāti Māori de muhalefette. Koalisyon anlaşması gereği başbakan yardımcılığı Mayıs 2025'te NZ First lideri Winston Peters'tan ACT lideri David Seymour'a geçti.",
    "Kampanyanın ana konuları hayat pahalılığı, ekonominin 2024–25'teki durgunluktan çıkışı, konut ve sağlık. Anketlerde seçmenler sağlık, hayat pahalılığı ve konut konularında Labour'u daha yetkin buluyor.",
    "En kutuplaştırıcı mesele Māori hakları. ACT'nin Waitangi Antlaşması'nın ilkelerini yeniden tanımlamak isteyen yasa tasarısı büyük protestolara yol açtı ve Nisan 2025'te mecliste reddedildi. Bu seçimde seçmenleri en çok bölen soru, Māori seçmen kütüğünün ve yedi Māori seçim bölgesinin geleceği.",
    "Sistem karma (MMP): her seçmenin iki oyu var. Bölge oyu 71 seçim bölgesinin milletvekilini belirler (2023'te 72'ydi); parti oyu ise 120 sandalyelik meclisin dağılımını belirler. Bir partinin liste sandalyesi alması için %5 parti oyu ya da en az bir bölge kazanması gerekir. Hükümet için 61 sandalye lazım.",
    "Yarış başa baş. Son anketlerde iki büyük parti birbirine çok yakın ve küçük partiler yükselişte. Opportunity partisi %5 barajının hemen etrafında; barajı geçerse hangi bloğun hükümet kuracağını belirleyen \"kral yapıcı\" olabilir." ],
    k: [["RNZ: anket, Opportunity baraj sınırında", "https://www.rnz.co.nz/news/politics_election-2026/2035492/new-poll-puts-election-on-knife-edge-with-opportunity-close-to-5-percent-threshold"],
        ["RNZ: seçimin 10 büyük sorusu", "https://www.rnz.co.nz/news/politics_election-2026/2095275/explainer-the-10-biggest-questions-new-zealand-has-about-the-election"],
        ["Vikipedi: 2026 Yeni Zelanda seçimi", "https://en.wikipedia.org/wiki/2026_New_Zealand_general_election"]] },
  "knesset-2026": { guncel: "29 Ekim 2026", p: [
    "Benjamin Netanyahu Aralık 2022'den beri Likud, aşırı sağ ve Haredi (ultra-Ortodoks) partilerle kurduğu hükümetin başında. 25. Knesset, 1988'den bu yana erken seçime gitmeden dört yıllık dönemini tamamlayan ilk meclis oldu ve 17 Temmuz 2026'da dağıldı.",
    "Dönemin arka planında 2023'teki yargı reformu protestoları, 7 Ekim 2023 saldırısı ve ardından gelen Gazze savaşı var. Haredilerin askerlik muafiyeti koalisyonu defalarca krize soktu. Kampanyada Netanyahu İran tehdidini öne çıkardı; eski genelkurmay başkanı Gadi Eisenkot'un yeni partisi Yashar muhalefetin en büyük gücü oldu.",
    "27 Ekim seçiminin ön sonuçlarına göre (oyların yaklaşık %90'ı sayıldığında) Likud 26 sandalyeyle en büyük parti, Yashar 21 sandalyeyle ikinci. Netanyahu bloku 53, Eisenkot'un muhalefet bloku 48 sandalyede; Arap partileri ise 17–19 sandalyeyle tarihî bir yüksekliğe çıktı. Hiçbir blok 61 sandalyelik çoğunluğa ulaşamadı. Kesin sonuçların 4 Kasım'da açıklanması bekleniyor.",
    "Sırada Cumhurbaşkanı Isaac Herzog'un partilerle görüşüp hükümeti kurma görevini birine vermesi var. Herzog liderlere yeni bir seçimi önlemeleri çağrısında bulundu. Muhalefetin çoğunluğa ulaşması Arap partilerinin desteğine bağlı; bu da muhalefetin kendi içinde tartışmalı. Hiçbir taraf hükümet kuramazsa İsrail yeniden sandığa gidebilir." ],
    k: [["Times of Israel (%90 sayım)", "https://www.timesofisrael.com/with-85-of-votes-counted-netanyahu-bloc-has-53-seats-eisenkots-48-arab-parties-surge-to-19/"],
        ["Jerusalem Post: sonuçlar", "https://www.jpost.com/israel-election-2026/article-913122"],
        ["Vikipedi: 2026 İsrail seçimi", "https://en.wikipedia.org/wiki/2026_Israeli_legislative_election"]] }
};
var simdi = Date.now();
SECIMLER.forEach(function (s) { s.durum = simdi < Date.parse(s.sayim) ? "gelecek" : simdi < Date.parse(s.bitis) ? "aktif" : "gecmis"; });
function sec(durum, yon) { return SECIMLER.filter(function (s) { return s.durum === durum; }).sort(function (a, b) { return yon * (Date.parse(a.sayim) - Date.parse(b.sayim)); })[0]; }
var q = (location.search.match(/[?&]secim=([\w-]+)/) || [])[1];
var S = SECIMLER.filter(function (s) { return s.id === q; })[0] || sec("aktif", 1) || sec("gelecek", 1) || sec("gecmis", -1);
function link(s) { return "?secim=" + s.id; }
function saat(iso) { try { return new Date(iso).toLocaleString("tr-TR", { timeZone: "Europe/Istanbul", day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" }) + " TSİ"; } catch (e) { return iso; } }
function alt(s) { return s.durum === "gelecek" ? "sayım " + saat(s.sayim) + "'de başlar" : s.durum === "aktif" ? "sayım sürüyor" : "sonuçlandı"; }
function menu() {
  var dark = matchMedia("(prefers-color-scheme: dark)").matches, bg = dark ? "#0B1017" : "#141B26";
  var grp = function (baslik, durum) {
    var l = SECIMLER.filter(function (s) { return s.durum === durum; })
      .sort(function (a, b) { return (durum === "gecmis" ? -1 : 1) * (Date.parse(a.sayim) - Date.parse(b.sayim)); });
    return '<details style="position:relative"><summary style="cursor:pointer;list-style:none;padding:6px 12px;border-radius:99px;border:1px solid #3A4555;' +
      (l.some(function (s) { return s.id === S.id; }) ? 'background:#E6EBF2;color:#141B26;' : '') + '">' + baslik + ' ▾</summary>' +
      '<div style="position:absolute;top:110%;left:0;z-index:50;background:' + bg + ';border:1px solid #3A4555;border-radius:10px;padding:6px;min-width:250px;box-shadow:0 8px 24px rgba(0,0,0,.3)">' +
      (l.length ? l.map(function (s) { return '<a href="' + link(s) + '" style="display:block;color:#E6EBF2;text-decoration:none;padding:8px 10px;border-radius:6px' +
        (s.id === S.id ? ';background:#2A3444' : '') + '"><b>' + s.ad + '</b><br><span style="font-size:12px;color:#98A3B3">' + s.tarih + ' · ' + alt(s) + '</span></a>'; }).join("")
        : '<div style="padding:8px 10px;color:#98A3B3">Şu an yok</div>') + '</div></details>';
  };
  var n = document.createElement("nav");
  n.setAttribute("style", "position:relative;z-index:40;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 16px;background:" + bg + ";color:#E6EBF2;font:600 14px system-ui,sans-serif");
  var canli = SECIMLER.some(function (s) { return s.durum === "aktif"; }) ? '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#4ADE80;margin-right:6px"></span>' : '';
  n.innerHTML = '<a href="./" style="color:#E6EBF2;text-decoration:none;margin-right:6px">Ulmocus Seçim</a>' +
    grp(canli + "Aktif seçimler", "aktif") + grp("Gelecek seçimler", "gelecek") + grp("Geçmiş seçimler", "gecmis");
  document.body.insertBefore(n, document.body.firstChild);
  siyasi(n, dark);
  document.addEventListener("click", function (e) { n.querySelectorAll("details").forEach(function (d) { if (!d.contains(e.target)) d.removeAttribute("open"); }); });
}
// Menünün sağına "Siyasi meseleler" düğmesi, sayfanın en altına ülkenin siyasi durumunu anlatan bölüm
function siyasi(n, dark) {
  var y = SIYASI[S.id]; if (!y) return;
  var b = document.createElement("a");
  b.href = "#siyasi-meseleler"; b.textContent = "Siyasi meseleler ↓";
  b.setAttribute("style", "margin-left:auto;color:#141B26;background:#FBBF24;text-decoration:none;padding:6px 12px;border-radius:99px;font-weight:700");
  b.onclick = function (e) { e.preventDefault(); document.getElementById("siyasi-meseleler").scrollIntoView({ behavior: "smooth", block: "start" }); };
  n.appendChild(b);
  var s = document.createElement("section"); s.id = "siyasi-meseleler";
  var ink = dark ? "#E6EBF2" : "#141B26", mut = dark ? "#98A3B3" : "#5B6675", card = dark ? "#161D28" : "#fff", line = dark ? "#2A3444" : "#DDE2EA";
  s.setAttribute("style", "max-width:1148px;margin:24px auto 32px;padding:20px 22px;background:" + card + ";color:" + ink + ";border:1px solid " + line +
    ";border-radius:12px;font:16px/1.65 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;box-sizing:border-box;width:calc(100% - 32px)");
  s.innerHTML = '<h2 style="font-size:20px;margin:0 0 4px">Siyasi meseleler: ' + S.ad + '</h2>' +
    '<div style="font-size:13px;color:' + mut + ';margin-bottom:12px">Ülkenin güncel siyasi durumu · ' + y.guncel + ' itibarıyla</div>' +
    y.p.map(function (t) { return '<p style="margin:0 0 12px">' + t + '</p>'; }).join("") +
    '<div style="font-size:13px;color:' + mut + '">Kaynaklar: ' + y.k.map(function (x) { return '<a href="' + x[1] + '" target="_blank" rel="noopener" style="color:' + (dark ? "#7AA7F0" : "#1F5FBF") + '">' + x[0] + '</a>'; }).join(" · ") +
    ' · <a href="#" onclick="scrollTo({top:0,behavior:\'smooth\'});return false" style="color:' + mut + '">↑ başa dön</a></div>';
  document.body.appendChild(s);
}
function yaz(h) { document.open(); document.write(h); document.close(); if (document.body) menu(); else addEventListener("DOMContentLoaded", menu); }
function al(u) { return fetch(u, { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); }); }
var p;
if (S.repo) {
  // Son commit'in sayfası (dal adresi ~5 dk önbellekli olabilir; commit adresi her zaman günceldir)
  p = fetch("https://api.github.com/repos/" + S.repo + "/commits/main", { headers: { Accept: "application/vnd.github.sha" }, cache: "no-store" })
    .then(function (r) { return r.ok ? r.text() : "main"; }).catch(function () { return "main"; })
    .then(function (sha) { return al("https://raw.githubusercontent.com/" + S.repo + "/" + sha + "/index.html" + (sha === "main" ? "?t=" + Date.now() : "")); });
} else p = al(S.src + "?t=" + Date.now());
p.then(yaz).catch(function () { if (S.yedek) location.replace(S.yedek); else document.body.innerHTML = "<p>Sayfa yüklenemedi, lütfen yenileyin.</p>"; });
})(); // yüklenen sayfanın değişkenleriyle çakışmasın diye her şey kapalı kapsamda
</script>
</body>
</html>
