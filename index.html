    "## Kim iktidarda?",
    "Bulgaristan 2021'den bu yana yedi erken seçim yaşadı. Rosen Jelyazkov hükümeti Aralık 2025'te haftalarca süren yolsuzluk karşıtı protestolar ve bütçe anlaşmazlığı üzerine istifa etti. Cumhurbaşkanı Rumen Radev aktif siyasete girmek için Ocak 2026'da görevden ayrıldı; Anayasa Mahkemesi istifayı 23 Ocak'ta kabul etti ve yardımcısı İliana Yotova ülkenin ilk kadın cumhurbaşkanı oldu. Yotova Şubat'ta merkez bankası başkan yardımcısı Andrey Gyurov'u geçici başbakan atadı. Radev'in yeni kurduğu İlerici Bulgaristan 19 Nisan seçiminde %43,9 oyla 240 sandalyenin 131'ini kazanıp tek başına çoğunluğa ulaştı; Radev Mayıs'ta başbakan oldu. GERB %13,2, Batı yanlısı PP–DB %12,4, DPS %7 aldı; sosyalist BSP 1991'den beri ilk kez meclis dışında kaldı.",

  "yeni-zelanda-2026": { guncel: "29 Ekim 2026", p: [
    "## Kim iktidarda?",
    "2023 seçiminden bu yana Başbakan Christopher Luxon'un merkez sağ National partisi, liberal-sağ ACT ve popülist NZ First ile üçlü koalisyon hükümeti yürütüyor. Koalisyon anlaşması gereği başbakan yardımcılığı Mayıs 2025'te NZ First lideri Winston Peters'tan ACT lideri David Seymour'a geçti; Peters dışişleri bakanı olarak kaldı. Ana muhalefet, eski başbakan Chris Hipkins liderliğindeki Labour. Yeşiller (eş başkanlar Marama Davidson ve Chlöe Swarbrick) ve Te Pāti Māori (eş başkanlar Debbie Ngarewa-Packer ve Rawiri Waititi) da muhalefette.",
    "## Dönemin olayları",
    "ACT'nin Waitangi Antlaşması'nın ilkelerini yeniden tanımlamak isteyen yasa tasarısı Kasım 2024'te ülke çapında büyük bir Māori yürüyüşüne (hīkoi) yol açtı ve Nisan 2025'te mecliste reddedildi. Hükümet düzenleme kurallarını yeniden yazan Düzenleyici Standartlar Yasası'nı ve Aralık 2025'te seçim kurallarını değiştiren bir yasayı çıkardı: seçim gününe yakın kayıt sınırlandı, mahkûmların oy hakkı kaldırıldı, bağış açıklama eşiği yükseltildi. Muhalefet her ikisine de karşı çıktı; Labour Düzenleyici Standartlar Yasası'nı ilk 100 günde kaldırma sözü verdi. Ağustos 2026'da Luxon'a karşı başarısız bir liderlik girişiminden sonra Chris Penk bakanlık görevlerini kaybetti.",

  "knesset-2026": { guncel: "29 Ekim 2026", p: [
    "## Kim iktidarda?",
    "Benjamin Netanyahu Aralık 2022'den beri Likud, aşırı sağ (Ben-Gvir'in Otzma Yehudit'i, Smotrich'in Dinî Siyonist Partisi) ve Haredi (ultra-Ortodoks: Shas ve Birleşik Tora Yahudiliği) partilerle kurduğu hükümetin başında. 25. Knesset, 1988'den bu yana erken seçime gitmeden dört yıllık dönemini tamamlayan ilk meclis oldu ve 17 Temmuz 2026'da dağıldı; seçim 27 Ekim'de yapıldı.",
    "## Dönemin arka planı",
    "Hükümetin 2023'teki yargı reformu girişimi ülke tarihinin en büyük protestolarına yol açtı. 7 Ekim 2023 saldırısı ve ardından gelen Gazze savaşı dönemin geri kalanını belirledi. Koalisyonu en çok sarsan mesele Haredilerin askerlik muafiyeti oldu: Haredi partisi Degel HaTorah Temmuz 2025'te bu yüzden hükümetten ayrıldı ve koalisyon defalarca dağılmanın eşiğine geldi. Kampanyada Netanyahu İran tehdidini öne çıkardı; muhalefet ise savaşın sorumluluğunu ve hükümetin yönetimini sorguladı.",

    "## Ön sonuçlar",
    "Oyların yaklaşık %90'ı sayıldığında Likud 26 sandalyeyle en büyük parti, Yashar 21 sandalyeyle ikinci. Netanyahu bloku 53, Eisenkot'un muhalefet bloku 48 sandalyede; Arap partileri ise 17–19 sandalyeyle tarihî bir rekor kırdı. Katılım %77,7. Hiçbir blok 120 sandalyelik meclisin 61'lik çoğunluğuna ulaşamadı. Kesin sonuçların 4 Kasım'da açıklanması bekleniyor; askerlerin ve dış temsilciliklerin oyları gibi çift zarflı oylar sandalyeleri biraz değiştirebilir.",
